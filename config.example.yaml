# morning-coffee configuration — SEED TEMPLATE.
#
# On first run the app copies this file to a per-user, cross-platform location
# and reads/writes it there (edit it in-app via the ⚙ settings screen):
#     macOS:   ~/Library/Application Support/morningcoffee/config.yaml
#     Linux:   ~/.config/morningcoffee/config.yaml
#     Windows: %APPDATA%\morningcoffee\config.yaml
# For local development you may also keep a `config.yaml` beside this file, or
# point $MORNING_COFFEE_CONFIG at an explicit path.
#
# Any value can be overridden by an environment variable named
# MC_<SECTION>_<KEY> (uppercased). The environment always wins over the YAML
# value, so you can keep structured settings here and inject secrets from your
# shell / .envrc. Examples:
#     export MC_MASTODON_ACCESS_TOKEN=abc123
#     export MC_TTRSS_PASSWORD=hunter2
# Sections map to the top-level keys below; for integrations the section is the
# integration name (e.g. MC_TTRSS_*, MC_LEMMY_*, MC_MASTODON_*, MC_WEATHER_*,
# MC_LOCATION_*).

location:
  postal_code: "94103"
  country: "us"          # ISO alpha-2 country code, for postal-code geocoding
  units: "fahrenheit"    # or "celsius"

integrations:
  # Each integration is its own panel; navigate between them with the ‹ / ›
  # arrows (or swipe).
  ttrss:
    enabled: true
    url: "https://rss.example.com/tt-rss/"   # "/api/" is appended automatically
    username: "me"
    password: ""          # secret — better set via MC_TTRSS_PASSWORD
    feed_id: -3           # -3 = Fresh (top of the day); -4 = All articles
    limit: 25
    verify_tls: true      # set false for self-signed instances

  lemmy:
    enabled: true
    instance: "lemmy.world"   # host only, no scheme / trailing slash
    sort: "TopDay"            # TopDay | Hot | New | TopWeek | TopHour | ...
    # Default listing type; switch it in-app via the dropdown at the top of the
    # Lemmy feed. Subscribed needs login (see username/password below).
    type_: "Subscribed"      # Subscribed | Local | All
    limit: 25
    # Optional login. Leave blank for anonymous read-only access. Logging in
    # enables type_: Subscribed, your read/vote state, and up/down voting.
    username: ""             # username or email
    password: ""             # secret — better set via MC_LEMMY_PASSWORD
    # totp_2fa_token: ""     # only if your account uses TOTP 2FA

  mastodon:
    enabled: true
    api_base_url: "https://mastodon.social"
    # Token scopes: read:notifications + read:statuses to read the feeds; add
    # write:statuses to post from the Compose tab. Trending needs no scope.
    access_token: ""      # secret — better set via MC_MASTODON_ACCESS_TOKEN
    notification_types:   # notification kinds to show
      - "mention"
      - "favourite"
      - "reblog"
      - "follow"
    notifications_limit: 25
    home_limit: 25
    trending_limit: 20
    default_visibility: "public"   # public | unlisted | private | direct
    max_characters: 500            # compose counter limit (instance default is 500)
    # Toggle which tabs appear in the Mastodon panel:
    show_notifications: true
    show_home: true
    show_trending: true
    show_compose: true

  weather:
    enabled: true
    forecast_days: 7
