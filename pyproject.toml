[project]
name = "morning-coffee"
version = "0.1.0"
description = "A morning dashboard that gives you the info you want to start the day."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    "kivy>=2.3.1",
    "httpx>=0.27",
    "Mastodon.py>=2.2.2",
    "PyYAML>=6.0",
]

[project.scripts]
morning-coffee = "morning_coffee.app:main"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"
